/* ============ HIỂN THỊ CÂU HỎI ============ */
const form=document.getElementById('quizForm');
questions.forEach((item,i)=>{
const div=document.createElement('div');
div.className='question';
div.innerHTML=`<h3>Câu ${i+1}. ${item.q}</h3><div class='options'>`+
item.o.map((op,j)=>`<label><input type='radio' name='q${i}' value='${j}'> ${String.fromCharCode(65+j)}. ${op}</label>`).join('')+
'</div>';
form.appendChild(div);
});

/* ============ NỘP BÀI – CHẤM ĐIỂM ============ */
function submitQuiz(){
let score=0;
questions.forEach((q,i)=>{
const opts=document.querySelectorAll(`input[name='q${i}']`);
opts.forEach((op,idx)=>{
if(idx===q.a) op.parentElement.classList.add('correct');
});
const sel=document.querySelector(`input[name='q${i}']:checked`);
if(sel){
if(Number(sel.value)===q.a) score++;
else sel.parentElement.classList.add('wrong');
}
});
document.getElementById('result').innerHTML=`✅ Kết quả: <b>${score}/95</b> câu đúng — Quy đổi: <b>${(score/95*10).toFixed(2)}</b> điểm`;
}

/* ============ ĐẾM GIỜ 45 PHÚT ============ */
let time=45*60;
const timer=setInterval(()=>{
if(time<=0){clearInterval(timer);submitQuiz();return;}
time--;
let m=Math.floor(time/60);
let s=time%60;
document.getElementById('time').textContent=`${m}:${s.toString().padStart(2,'0')}`;
},1000);
</script>
